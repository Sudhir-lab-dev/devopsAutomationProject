apiVersion: apps/v1
kind: Deployment

metadata:
  name: automation-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: automation-app

  template:
    metadata:
      labels:
        app: automation-app

    spec:
      serviceAccountName: automation-app

      containers:
        - name: automation-app

          image: 218589468002.dkr.ecr.us-east-1.amazonaws.com/automation-devops-project:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "2Gi"